local_backend: true

backend:
  name: git-gateway
  branch: main

media_folder: "src/images"
public_folder: "/images"

locale: "fr"

collections:
  - name: "projects"
    label: "Projets"
    label_singular: "Projet"
    folder: "src/projects"
    create: true
    slug: "{{slug}}"
    summary: "{{order}} · {{title}}"
    sortable_fields: ["order", "title"]
    fields:
      - { name: "title", label: "Titre du projet", widget: "string" }
      - { name: "order", label: "Ordre d'affichage (petit = en premier)", widget: "number", value_type: "int", default: 10 }
      - { name: "category", label: "Catégorie", widget: "string", required: false, hint: "ex. Identité visuelle, Affiches, Logotype" }
      - { name: "client", label: "Client", widget: "string", required: false }
      - { name: "year", label: "Année", widget: "string", required: false }
      - { name: "cover", label: "Image d'appel GAUCHE (accueil)", widget: "image", required: false, hint: "Image couleur : affichée en N&B, passe en couleur au survol." }
      - { name: "cover2", label: "Image d'appel DROITE (accueil)", widget: "image", required: false, hint: "2e image d'appel. Vide = reprend l'image de gauche." }
      - name: "colorSide"
        label: "Image en couleur sur l'accueil"
        widget: "select"
        default: "none"
        required: false
        hint: "Choisis quelle image d'appel reste en couleur. L'autre reste en N&B (couleur au survol)."
        options:
          - { label: "Aucune (N&B, couleur au survol)", value: "none" }
          - { label: "Gauche en couleur", value: "left" }
          - { label: "Droite en couleur", value: "right" }
          - { label: "Les deux en couleur", value: "both" }
      - { name: "developed", label: "Page développée (avec texte) ?", widget: "boolean", default: false, hint: "Désactivé = page simple (images seules)." }
      - { name: "context", label: "Texte — Contexte", widget: "text", required: false }
      - { name: "approach", label: "Texte — Parti pris", widget: "text", required: false }
      - name: "images"
        label: "Médias du projet (images / vidéos)"
        widget: "list"
        required: false
        summary: "{{fields.alt}}"
        fields:
          - { name: "image", label: "Image", widget: "image", required: false }
          - { name: "video", label: "Vidéo (MP4) — à la place de l'image", widget: "file", required: false, hint: "Renseigne SOIT une image, SOIT une vidéo." }
          - { name: "alt", label: "Description (accessibilité)", widget: "string", required: false }
          - { name: "wide", label: "Pleine largeur (horizontale / vidéo) ?", widget: "boolean", default: false, hint: "Coché = pleine largeur. Décoché = vertical, par deux." }

  - name: "settings"
    label: "Pages"
    files:
      - name: "site"
        label: "Général (logo, titres)"
        file: "src/_data/site.json"
        fields:
          - { name: "name", label: "Nom", widget: "string" }
          - { name: "tagline", label: "Sous-titre (centre de l'en-tête)", widget: "string" }
          - { name: "url", label: "Adresse du site", widget: "string" }
          - { name: "logo", label: "Logo (SVG)", widget: "image", required: false, hint: "Laisse vide pour afficher le nom en texte." }
      - name: "design"
        label: "Réglages design"
        file: "src/_data/design.json"
        fields:
          - { name: "logoWidth", label: "Largeur du logo (px)", widget: "number", value_type: "int", default: 150, min: 40, max: 400 }
          - { name: "paper", label: "Couleur de fond — mode clair", widget: "color", default: "#ffffff" }
          - { name: "ink", label: "Couleur du texte — mode clair", widget: "color", default: "#111111" }
          - { name: "paperDark", label: "Couleur de fond — mode sombre", widget: "color", default: "#141414" }
          - { name: "inkDark", label: "Couleur du texte — mode sombre", widget: "color", default: "#f2f2f2" }
          - { name: "projGap", label: "Marge entre les images des projets (px)", widget: "number", value_type: "int", default: 24, min: 0, max: 80 }
          - { name: "cursor", label: "Curseur licorne", widget: "boolean", default: true }
          - { name: "scrollHint", label: "Indice de scroll (mobile)", widget: "boolean", default: true }
          - { name: "projectNames", label: "Afficher le nom des projets sur l'accueil", widget: "boolean", default: false }
          - { name: "reduceMotion", label: "Respecter « animations réduites » du système", widget: "boolean", default: true }
      - name: "infos"
        label: "Page Infos"
        file: "src/_data/infos.json"
        fields:
          - { name: "intro", label: "Présentation", widget: "text" }
          - name: "clients"
            label: "Clients"
            widget: "list"
            required: false
            summary: "{{fields.name}}"
            fields:
              - { name: "name", label: "Nom", widget: "string" }
              - { name: "place", label: "Ville", widget: "string", required: false }
          - { name: "email", label: "E-mail", widget: "string" }
          - { name: "phone", label: "Téléphone", widget: "string" }
          - { name: "instagram", label: "Lien Instagram", widget: "string", required: false }
          - { name: "linkedin", label: "Lien LinkedIn", widget: "string", required: false }
          - { name: "behance", label: "Lien Behance", widget: "string", required: false }
          - { name: "legal", label: "Mentions légales", widget: "text" }
